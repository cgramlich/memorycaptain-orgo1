<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MemoryCaptain — Organic Chemistry 1</title>
</head>
<body>
<style>
  /* Design settled in the 2026-08-16 study. Ground is engineering-paper sage,
     not the fashionable warm cream; dark is a green-biased near-black, because
     white on true black haloes and hurts over a long session. Brand plum is an
     ACCENT only - it is right on a 46px icon badge, wrong as a reading surface. */
  /* `--quiet` replaced an `--accent-soft` lilac tint that was used as a SURFACE
     for the verdict chip and the Retained pill. Plum on sage-grey is a
     near-complementary pair; at low saturation and large area it goes muddy.
     Plum stays for small accent MARKS only - dates, links, the progress bar. */
  :root {
    --bg:#E7EBE3; --card:#F4F6F1; --ink:#1E241F; --soft:#5D665C; --faint:#8B948A;
    --rule:#CBD2C4; --accent:#5B3D7F; --quiet:#DFE4D9; --chip:#E2E8DC;
    --again:#9C4F3D; --hard:#8A7130; --good:#47705A; --easy:#5B3D7F;
    --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  }
  :root[data-theme="dark"] {
    --bg:#141917; --card:#1B211E; --ink:#E6EAE2; --soft:#98A197; --faint:#6E776D;
    --rule:#2A322C; --accent:#A98BD0; --quiet:#232A26; --chip:#222925;
    --again:#D08C79; --hard:#C8A85A; --good:#7FB394; --easy:#A98BD0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#141917; --card:#1B211E; --ink:#E6EAE2; --soft:#98A197; --faint:#6E776D;
      --rule:#2A322C; --accent:#A98BD0; --quiet:#232A26; --chip:#222925;
      --again:#D08C79; --hard:#C8A85A; --good:#7FB394; --easy:#A98BD0;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;padding:20px 16px 28px;
    min-height:100vh;min-height:100dvh;
  }
  /* The column fills the viewport and the CARD takes the slack, so a short card
     grows to meet the grading row instead of leaving a void beneath it. The
     earlier fixed min-height left ~350px of dead space on a tall window, which
     is what read as unbalanced. dvh so mobile browser chrome does not break it. */
  .app{
    width:100%;max-width:430px;display:flex;flex-direction:column;gap:16px;
    min-height:calc(100vh - 48px);min-height:calc(100dvh - 48px);
  }

  /* quiet top rail - nothing here competes with the card */
  .rail{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .rail-l{display:flex;align-items:baseline;gap:9px;min-width:0}
  .deck{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  .icons{display:flex;gap:4px}
  .ico{
    appearance:none;border:0;background:transparent;color:var(--faint);cursor:pointer;
    font:inherit;font-size:12px;padding:5px 8px;border-radius:8px;
  }
  .ico:hover{color:var(--ink);background:var(--chip)}
  .ico:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .ico[aria-pressed="true"]{color:var(--ink);background:var(--quiet)}
  .progress{height:2px;background:var(--rule);border-radius:2px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .18s}

  /* The card HUGS its content. Stretching it to fill the column only moved the
     empty space inside the card, where `margin-top:auto` on the citation opened
     a gap between the answer and its source. The leftover height belongs to
     .stage, which centres the card-and-controls group instead. */
  .card{
    background:var(--card);border:1px solid var(--rule);border-radius:18px;
    padding:24px 20px;display:flex;flex-direction:column;gap:16px;
  }
  .stage{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center}
  .stage.top{justify-content:flex-start}  /* lists grow downward; don't re-centre on every add */
  .q{font:400 20px/1.5 var(--serif);margin:0;text-wrap:pretty}
  .a{font:400 16.5px/1.65 var(--serif);margin:0;text-wrap:pretty}
  .a em{font-style:italic}
  sub{font-size:.74em;line-height:0}
  hr.hair{height:1px;background:var(--rule);border:0;margin:0}

  textarea{
    width:100%;border:1px solid var(--rule);border-radius:12px;background:var(--bg);
    color:var(--ink);padding:12px 14px;resize:vertical;min-height:88px;
    /* NOT `font: 15px/1.55 inherit` - the font shorthand does not accept `inherit`
       as the family, so the whole declaration is dropped and the control silently
       falls back to monospace 13px. Set the longhands. */
    font-family:inherit;font-size:15px;line-height:1.55;
  }
  textarea::placeholder{color:var(--faint)}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

  .typed{
    border:1px solid var(--rule);border-radius:12px;background:var(--bg);
    padding:11px 14px;font-size:14.5px;color:var(--soft);white-space:pre-wrap;word-break:break-word;
  }
  .verdict{display:flex;gap:10px;align-items:flex-start;background:var(--quiet);
           border-radius:12px;padding:11px 14px}
  .verdict .mark{font-weight:700;font-size:15px;line-height:1.5;flex:none}
  .verdict p{margin:0;font-size:13.5px;line-height:1.55;color:var(--soft)}
  .verdict strong{color:var(--ink);font-weight:600}
  .v-correct .mark{color:var(--good)}
  .v-incorrect .mark{color:var(--again)}
  .v-needs-model .mark{color:var(--hard)}

  .src{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:auto;
       font-size:12px;color:var(--faint);padding-top:13px;border-top:1px solid var(--rule)}
  .src b{font-weight:600;color:var(--soft)}

  button.primary{
    appearance:none;border:1px solid var(--accent);background:transparent;color:var(--accent);
    border-radius:13px;padding:13px;cursor:pointer;width:100%;
    font-family:inherit;font-weight:600;font-size:14px;line-height:1;  /* see textarea note */
  }
  button.primary:hover{background:var(--accent-soft)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .g{
    appearance:none;border:1px solid var(--rule);background:var(--card);border-radius:13px;
    padding:11px 4px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
    gap:3px;font-family:inherit;color:var(--ink);transition:border-color .12s,background .12s;
  }
  .g:hover{border-color:var(--faint)}
  .g b{font-size:13px;font-weight:600}
  .g span{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .g.again b{color:var(--again)} .g.hard b{color:var(--hard)}
  .g.good b{color:var(--good)}   .g.easy b{color:var(--easy)}
  .g.suggested{border-color:currentColor;background:var(--chip)}

  /* retained shelf */
  h2{font:600 19px/1.25 var(--serif);margin:0}
  .shelf-head p{margin:2px 0 0;font-size:13px;color:var(--faint)}
  .row{display:flex;align-items:baseline;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule)}
  .row:last-child{border-bottom:0}
  /* One line, ellipsis in CSS. The previous version sliced the string at 90
     chars in JS, which cut words in half ("...and wha") - a bug, not a style
     choice. Never truncate text with substring; let the browser do it. */
  .row p{
    margin:0;flex:1;min-width:0;font:400 14.5px/1.5 var(--serif);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* Fixed column so the dates line up instead of floating against ragged text. */
  .when{font-size:12px;color:var(--accent);white-space:nowrap;font-weight:600;
        font-variant-numeric:tabular-nums;flex:none;width:52px;text-align:right}
  .empty{color:var(--faint);font-size:14px;margin:0;text-align:center;padding:28px 10px}
  .foot{font-size:12px;color:var(--faint);margin:0;text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app"></div>
<script type="module">
// ---- src/fsrs.js ----
const { Scheduler, Rating, State } = (() => {
// MemoryCaptain - FSRS-6 scheduler.
//
// This is the engine that decides WHEN you next see a card. It is the one piece
// of this app where a subtle bug is invisible for months and then quietly ruins
// everyone's retention, so it is built and tested before any UI exists.
//
// ---------------------------------------------------------------------------
// PROVENANCE - read this before changing any number below
// ---------------------------------------------------------------------------
// Algorithm: FSRS-6 (Free Spaced Repetition Scheduler), 21 parameters.
// Transcribed 2026-08-15 from the reference implementation `py-fsrs`
// (github.com/open-spaced-repetition/py-fsrs, `fsrs/scheduler.py`), MIT licence,
// Copyright (c) 2022 Open Spaced Repetition.
//
// It was NOT written from memory, deliberately. The formulation has changed
// across versions - the forgetting curve moved from exponential to a power
// function, and FSRS-6 made DECAY a trainable parameter (w[20]) rather than the
// old fixed -0.5. A from-memory implementation would be subtly and permanently
// wrong, which in a spaced-repetition app is the worst class of bug: every card
// drifts a little, nobody notices, and a year of study is quietly degraded.
//
// Two secondary sources were checked and DISAGREED with each other on weight
// indices; where they conflicted, the reference implementation won. If you
// update this file, re-read the reference implementation - do not trust a blog
// post, and do not trust this comment either once py-fsrs has moved on.
//
// LICENCE BOUNDARY, and it matters: py-fsrs is MIT and the FSRS papers are
// public, but **Anki itself is AGPL-3**. No Anki source, and nothing derived
// from Anki's scheduler, may enter this repo. See the `no-agpl-dependencies`
// rule. What is reproduced here is the algorithm - the maths - implemented
// independently, which is exactly what the MIT reference exists to enable.
//
// WHY WE OWN THIS RATHER THAN DEPEND ON IT: the review loop has to work offline
// on a phone, so the scheduler must run client-side. A Python dependency on the
// backend would not serve the actual need, and the whole thing is ~200 lines.
//
// ---------------------------------------------------------------------------
// THE MODEL IN ONE PARAGRAPH
// ---------------------------------------------------------------------------
// Every card carries three numbers. STABILITY (S) is how many days until your
// chance of recalling it decays to 90%. DIFFICULTY (D, 1..10) is how intrinsically
// hard this card is for you. RETRIEVABILITY (R, 0..1) is your chance of recalling
// it right now, which falls along a forgetting curve as time passes. You pick a
// DESIRED RETENTION; the scheduler then picks each interval so that R lands on
// that number on the day the card comes back. As S grows, the interval that still
// yields 90% recall grows with it - which is where "eventually it only asks once
// a year" comes from. That is a real property of the model, not marketing.

// The PWA inlines this file into its single `<script>` block by stripping the
// `export` keywords; keep every declaration standalone so that stays mechanical.

/** Grades. The user's answer is mapped to one of these before it reaches here. */
const Rating = Object.freeze({ Again: 1, Hard: 2, Good: 3, Easy: 4 });

/** Where a card sits in its lifecycle. */
const State = Object.freeze({ Learning: 0, Review: 1, Relearning: 2 });

/**
 * FSRS-6 default weights, w[0]..w[20]. These are the population averages the
 * reference ships. They are a starting point: once a user has a few hundred
 * reviews their own weights can be fitted from `review_log`, which is why that
 * collection is append-only and never trimmed.
 */
const DEFAULT_PARAMETERS = Object.freeze([
  0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666,
  0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658,
  0.1542,
]);

const STABILITY_MIN = 0.001;
const DIFFICULTY_MIN = 1.0;
const DIFFICULTY_MAX = 10.0;

const MINUTE = 60 * 1000;
const DAY = 24 * 60 * MINUTE;

const clamp = (x, lo, hi) => Math.min(Math.max(x, lo), hi);

/**
 * Round half to EVEN, matching Python's built-in `round`.
 *
 * This is not pedantry. The reference computes intervals with Python's round,
 * which is banker's rounding; JavaScript's Math.round is round-half-up. They
 * differ on exact .5 values, so using Math.round would make our intervals
 * silently diverge from the reference on those boundaries - and a scheduler
 * that "almost" matches its spec is untestable against it.
 */
function roundHalfEven(x) {
  const floor = Math.floor(x);
  const diff = x - floor;
  if (diff > 0.5) return floor + 1;
  if (diff < 0.5) return floor;
  return floor % 2 === 0 ? floor : floor + 1;
}

class Scheduler {
  /**
   * @param {object} [opts]
   * @param {number[]} [opts.parameters]      21 FSRS weights.
   * @param {number}   [opts.desiredRetention] Target recall probability, 0..1.
   * @param {number[]} [opts.learningSteps]    Same-day steps, in MINUTES.
   * @param {number[]} [opts.relearningSteps]  Same-day steps after a lapse.
   * @param {number}   [opts.maximumInterval]  Hard ceiling in days.
   */
  constructor(opts = {}) {
    this.parameters = [...(opts.parameters ?? DEFAULT_PARAMETERS)];
    if (this.parameters.length !== 21) {
      throw new Error(`FSRS-6 needs exactly 21 parameters, got ${this.parameters.length}`);
    }
    // 0.9 is the sensible default. Raising it means shorter intervals and more
    // reviews for the same material; lowering it trades recall for volume.
    this.desiredRetention = opts.desiredRetention ?? 0.9;
    this.learningSteps = opts.learningSteps ?? [1, 10];
    this.relearningSteps = opts.relearningSteps ?? [10];
    this.maximumInterval = opts.maximumInterval ?? 36500;

    // DECAY is w[20] negated, and FACTOR is derived so that R(S, S) === 0.9 by
    // construction - i.e. so "stability" genuinely means "days until 90%".
    // Deriving FACTOR rather than hardcoding it is what keeps that definition
    // true when w[20] is retrained per user.
    this.decay = -this.parameters[20];
    this.factor = Math.pow(0.9, 1 / this.decay) - 1;
  }

  /** A brand-new, never-reviewed card. */
  newCard() {
    return {
      state: State.Learning,
      step: 0,
      stability: null,
      difficulty: null,
      due: null,        // ms epoch; null means "due now"
      lastReview: null, // ms epoch
    };
  }

  /**
   * Probability of recalling `card` at `now`. Drives the review queue ordering
   * and the "how solid is this?" display.
   */
  retrievability(card, now = Date.now()) {
    if (card.lastReview == null || card.stability == null) return 0;
    const elapsedDays = Math.max(0, Math.floor((now - card.lastReview) / DAY));
    return Math.pow(1 + (this.factor * elapsedDays) / card.stability, this.decay);
  }

  // --- the model ----------------------------------------------------------

  _initialStability(rating) {
    return Math.max(this.parameters[rating - 1], STABILITY_MIN);
  }

  /**
   * @param {number} rating
   * @param {boolean} [clampResult] Pass false ONLY for the mean-reversion
   *   anchor, which is deliberately allowed out of the [1,10] range.
   */
  _initialDifficulty(rating, clampResult = true) {
    const w = this.parameters;
    const d = w[4] - Math.exp(w[5] * (rating - 1)) + 1;
    return clampResult ? clamp(d, DIFFICULTY_MIN, DIFFICULTY_MAX) : d;
  }

  /**
   * Difficulty drifts by grade, then reverts toward a fixed anchor.
   *
   * THE ANCHOR IS D0(Easy) COMPUTED WITHOUT CLAMPING, and with the default
   * weights that is about -4.77 - a value outside the legal [1,10] difficulty
   * range, on purpose. Because it sits below the range, mean reversion always
   * pulls difficulty DOWNWARD, so a card that is merely being answered "Good"
   * forever slowly gets easier rather than drifting up.
   *
   * This cost a debugging cycle and is worth spelling out. A secondary source
   * described this anchor as `w[4] - e^w[5] + 1`, which is D0(HARD) = +5.11 -
   * the wrong grade AND the wrong sign of pull. Implementing that produced
   * intervals that matched the reference for the first four reviews and then
   * silently ran 1-5% short, compounding forever. That is precisely the failure
   * mode this file's header warns about: it looks right, it tests fine by eye,
   * and it quietly degrades every schedule.
   *
   * The `(10 - D) / 9` damping means a card already near maximum difficulty
   * barely moves, so one bad day cannot pin a card at 10 forever.
   */
  _nextDifficulty(difficulty, rating) {
    const w = this.parameters;
    const anchor = this._initialDifficulty(Rating.Easy, false);
    const delta = -(w[6] * (rating - 3));
    const damped = difficulty + ((10 - difficulty) * delta) / 9;
    return clamp(w[7] * anchor + (1 - w[7]) * damped, DIFFICULTY_MIN, DIFFICULTY_MAX);
  }

  /**
   * Stability change for a review on the SAME day as the last one.
   *
   * Same-day repeats are worth much less than spaced ones - that is the whole
   * point of spacing - so this is a separate, gentler formula. The floor of 1.0
   * for non-Again grades stops a same-day success from ever REDUCING stability.
   */
  _shortTermStability(stability, rating) {
    const w = this.parameters;
    let increase =
      Math.exp(w[17] * (rating - 3 + w[18])) * Math.pow(stability, -w[19]);
    if (rating >= Rating.Hard) increase = Math.max(increase, 1.0);
    return Math.max(stability * increase, STABILITY_MIN);
  }

  /**
   * Stability after a SUCCESSFUL spaced review.
   *
   * The `(e^((1-R) * w[10]) - 1)` term is the spacing effect made explicit:
   * the lower your retrievability was when you got it right - i.e. the closer
   * you were to forgetting - the bigger the gain. Reviewing something you
   * already know perfectly buys you almost nothing, which is why cramming fails.
   */
  _nextRecallStability(difficulty, stability, retrievability, rating) {
    const w = this.parameters;
    const hardPenalty = rating === Rating.Hard ? w[15] : 1;
    const easyBonus = rating === Rating.Easy ? w[16] : 1;
    const gain =
      Math.exp(w[8]) *
      (11 - difficulty) *
      Math.pow(stability, -w[9]) *
      (Math.exp((1 - retrievability) * w[10]) - 1) *
      hardPenalty *
      easyBonus;
    return Math.max(stability * (1 + gain), STABILITY_MIN);
  }

  /**
   * Stability after FORGETTING (a lapse).
   *
   * Capped by the short-term branch so a lapse can never leave a card MORE
   * stable than a same-day failure would have.
   */
  _nextForgetStability(difficulty, stability, retrievability) {
    const w = this.parameters;
    const longTerm =
      w[11] *
      Math.pow(difficulty, -w[12]) *
      (Math.pow(stability + 1, w[13]) - 1) *
      Math.exp((1 - retrievability) * w[14]);
    const shortTerm = stability / Math.exp(w[17] * w[18]);
    return Math.max(Math.min(longTerm, shortTerm), STABILITY_MIN);
  }

  /** Days until retrievability decays from 1 to `desiredRetention`. */
  _nextInterval(stability) {
    const days =
      (stability / this.factor) *
      (Math.pow(this.desiredRetention, 1 / this.decay) - 1);
    return clamp(roundHalfEven(days), 1, this.maximumInterval);
  }

  // --- the state machine --------------------------------------------------

  /**
   * Grade a card and return `{ card, log }` - a NEW card object, never a mutation.
   *
   * Immutability is deliberate: the caller writes `log` to the append-only
   * review history and the card to its own record, and those are separate
   * writes. Mutating in place makes a partial failure corrupt the card silently.
   */
  reviewCard(card, rating, now = Date.now()) {
    const daysSinceLastReview =
      card.lastReview == null
        ? null
        : Math.max(0, Math.floor((now - card.lastReview) / DAY));

    const next = { ...card };

    // --- update the memory state ---
    if (next.stability == null || next.difficulty == null) {
      next.stability = this._initialStability(rating);
      next.difficulty = this._initialDifficulty(rating);
    } else if (daysSinceLastReview != null && daysSinceLastReview < 1) {
      next.stability = this._shortTermStability(next.stability, rating);
      next.difficulty = this._nextDifficulty(next.difficulty, rating);
    } else {
      const r = this.retrievability(card, now);
      next.stability =
        rating === Rating.Again
          ? this._nextForgetStability(next.difficulty, next.stability, r)
          : this._nextRecallStability(next.difficulty, next.stability, r, rating);
      next.difficulty = this._nextDifficulty(next.difficulty, rating);
    }

    // --- decide the next due time ---
    let intervalMs;
    switch (card.state) {
      case State.Learning:
        intervalMs = this._advanceSteps(next, rating, this.learningSteps, State.Learning);
        break;
      case State.Relearning:
        intervalMs = this._advanceSteps(next, rating, this.relearningSteps, State.Relearning);
        break;
      case State.Review:
        if (rating === Rating.Again) {
          if (this.relearningSteps.length === 0) {
            next.state = State.Review;
            next.step = null;
            intervalMs = this._nextInterval(next.stability) * DAY;
          } else {
            next.state = State.Relearning;
            next.step = 0;
            intervalMs = this.relearningSteps[0] * MINUTE;
          }
        } else {
          next.state = State.Review;
          next.step = null;
          intervalMs = this._nextInterval(next.stability) * DAY;
        }
        break;
      default:
        throw new Error(`unknown card state: ${card.state}`);
    }

    next.lastReview = now;
    next.due = now + intervalMs;

    return {
      card: next,
      log: {
        rating,
        reviewedAt: now,
        elapsedDays: daysSinceLastReview,
        stability: next.stability,
        difficulty: next.difficulty,
        state: card.state,
      },
    };
  }

  /**
   * Shared Learning/Relearning step walk. Mutates `next.state`/`next.step` and
   * returns the interval in ms.
   *
   * The `step >= steps.length` guard is not theoretical: a user who shortens
   * their learning steps in settings leaves existing cards parked on a step
   * that no longer exists, and without this they would be stuck being asked
   * every minute forever.
   */
  _advanceSteps(next, rating, steps, stateWhenStepping) {
    if (steps.length === 0 || next.step >= steps.length) {
      // Nothing left to step through: graduate, unless they failed it.
      if (rating === Rating.Again && steps.length > 0) {
        next.state = stateWhenStepping;
        next.step = 0;
        return steps[0] * MINUTE;
      }
      next.state = State.Review;
      next.step = null;
      return this._nextInterval(next.stability) * DAY;
    }

    switch (rating) {
      case Rating.Again:
        next.state = stateWhenStepping;
        next.step = 0;
        return steps[0] * MINUTE;

      case Rating.Hard:
        // Repeat the current step. With only one step defined there is no next
        // step to average against, so 1.5x that step is used as the stand-in.
        next.state = stateWhenStepping;
        if (next.step === 0 && steps.length === 1) return steps[0] * 1.5 * MINUTE;
        if (next.step === 0 && steps.length >= 2) {
          return ((steps[0] + steps[1]) / 2) * MINUTE;
        }
        return steps[next.step] * MINUTE;

      case Rating.Good:
        if (next.step + 1 === steps.length) {
          next.state = State.Review;
          next.step = null;
          return this._nextInterval(next.stability) * DAY;
        }
        next.state = stateWhenStepping;
        next.step = next.step + 1;
        return steps[next.step] * MINUTE;

      case Rating.Easy:
        // Easy always graduates immediately, skipping any remaining steps.
        next.state = State.Review;
        next.step = null;
        return this._nextInterval(next.stability) * DAY;

      default:
        throw new Error(`unknown rating: ${rating}`);
    }
  }
}

const _internals = { roundHalfEven, DAY, MINUTE };

return { Rating, State, DEFAULT_PARAMETERS, Scheduler, _internals };
})();

// ---- src/grading.js ----
const { gradeAnswer, suggestedRating, Verdict } = (() => {
// MemoryCaptain - free-recall answer grading.
//
// The wedge of the whole app: you TYPE the answer rather than flipping a card and
// self-grading. Producing an answer from nothing is far stronger than recognising
// one, and until LLMs it could not be graded at scale. This module is the part
// that makes it affordable.
//
// ---------------------------------------------------------------------------
// THE COST ARGUMENT, which is the reason this file exists at all
// ---------------------------------------------------------------------------
// Sending every review to a model would destroy the app's economics. The whole
// point of MemoryCaptain's cost shape is that generation is expensive and REVIEW
// IS NEARLY FREE, so a user who studies daily forever costs almost nothing after
// the initial ingest. That only holds if most answers are graded locally.
//
// So grading is a LADDER. It stops at the first rung that resolves:
//
//   1. empty answer                        -> incorrect   (no model call)
//   2. every required concept present      -> correct     (no model call)
//   3. no concept present, no overlap      -> incorrect   (no model call)
//   4. anything in between                 -> ASK THE MODEL
//
// Rung 4 is the only one that costs money, and it should be the minority.
//
// ---------------------------------------------------------------------------
// WHY CONCEPTS RATHER THAN STRING SIMILARITY
// ---------------------------------------------------------------------------
// String similarity is the obvious approach and it is wrong for free recall.
// "backside attack, flips the stereochem" and "approaches 180 degrees from the
// leaving group, inverting the configuration" share almost no characters and are
// the same answer. Edit distance would mark that wrong, the user would learn not
// to trust the grader, and they would go back to self-grading - which is the
// weaker method this app exists to replace.
//
// So each card declares the CONCEPTS its answer must contain, each with the
// wordings that count. That is more work per card, but the card generator
// produces them, and it makes grading explainable: the UI can say exactly which
// idea was missing rather than "wrong".

/**
 * Fold an answer to a comparable form: lowercase, punctuation to spaces, runs of
 * whitespace collapsed.
 *
 * Degree signs and digits are KEPT. In chemistry "180" is load-bearing - it is
 * the difference between describing backside attack and describing nothing - so
 * the usual trick of stripping numbers would silently break the subject we are
 * building for first.
 */
function normalize(text) {
  return String(text ?? '')
    // Cards store display HTML so chemistry sets properly (S<sub>N</sub>2, sp<sup>3</sup>).
    // Tags are removed rather than space-separated so the markup does not split the
    // token: S<sub>N</sub>2 has to fold to "sn2", not to "s n 2".
    .replace(/<[^>]*>/g, '')
    .toLowerCase()
    .replace(/[^\p{L}\p{N}°]+/gu, ' ')
    .trim()
    .replace(/\s+/g, ' ');
}

const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/**
 * Does `norm` contain `phrase` as whole words?
 *
 * A trailing `*` makes it a prefix match, which is how the decks handle
 * inflection without a stemmer: `invert*` covers invert, inverts, inverted and
 * inversion. Substring matching without the word boundary would let "anti" fire
 * on "antibonding", which is a different concept entirely.
 */
function hasPhrase(norm, phrase) {
  const prefix = phrase.endsWith('*');
  const body = escapeRe(normalize(prefix ? phrase.slice(0, -1) : phrase));
  if (!body) return false;
  const tail = prefix ? '[\\p{L}\\p{N}]*' : '';
  return new RegExp(`(^|\\s)${body}${tail}(\\s|$)`, 'u').test(norm);
}

/** Content-word overlap, used only to separate "wrong" from "worth asking about". */
const STOP = new Set(
  ('a an the and or but of to in on at is are was were be been it its this that these those ' +
   'with for from by as if then than so we you i he she they them there here what which who ' +
   'when where how why does do did not no yes can could would should will shall may might').split(' '),
);

function contentTokens(norm) {
  return new Set(norm.split(' ').filter((t) => t && !STOP.has(t)));
}

function overlapRatio(answerNorm, referenceNorm) {
  const a = contentTokens(answerNorm);
  const b = contentTokens(referenceNorm);
  if (a.size === 0 || b.size === 0) return 0;
  let shared = 0;
  for (const t of a) if (b.has(t)) shared += 1;
  return shared / Math.min(a.size, b.size);
}

const Verdict = Object.freeze({
  Correct: 'correct',
  Incorrect: 'incorrect',
  NeedsModel: 'needs-model',
});

/**
 * Grade a typed answer against a card.
 *
 * @returns {{
 *   verdict: string,          one of Verdict
 *   hit: string[],            concept names found
 *   missed: string[],         required concept names not found
 *   overlap: number,          0..1 content-word overlap with the reference answer
 *   usedModel: false,         always false here; rung 4 is resolved by the caller
 *   explain: string           one line the UI can show verbatim
 * }}
 */
function gradeAnswer(card, rawAnswer, opts = {}) {
  const { incorrectBelowOverlap = 0.18 } = opts;
  const norm = normalize(rawAnswer);
  const concepts = card.accept ?? [];
  const required = concepts.filter((c) => c.required !== false);

  const hit = [];
  const missed = [];
  for (const c of concepts) {
    const found = (c.any ?? []).some((p) => hasPhrase(norm, p));
    if (found) hit.push(c.name);
    else if (c.required !== false) missed.push(c.name);
  }

  const overlap = overlapRatio(norm, normalize(card.back));
  const base = { hit, missed, overlap, usedModel: false };

  // Rung 1: nothing typed. Not a judgement call.
  if (!norm) {
    return { ...base, verdict: Verdict.Incorrect, explain: 'Nothing entered.' };
  }

  // Rung 2: every required idea is present, in some wording. Resolved locally.
  if (required.length > 0 && missed.length === 0) {
    return {
      ...base,
      verdict: Verdict.Correct,
      explain: `You had ${hit.length === 1 ? 'the key idea' : 'all ' + hit.length + ' key ideas'}.`,
    };
  }

  // Rung 3: no idea present and barely a word in common. Also resolved locally.
  if (hit.length === 0 && overlap < incorrectBelowOverlap) {
    return {
      ...base,
      verdict: Verdict.Incorrect,
      explain: missed.length
        ? `Missing: ${missed.join(', ')}.`
        : 'That does not match the answer.',
    };
  }

  // Rung 4: the ambiguous middle. This is the ONLY band worth paying a model for -
  // partially right, or right in wording the card did not anticipate.
  return {
    ...base,
    verdict: Verdict.NeedsModel,
    explain: missed.length
      ? `Partly there. Not seen: ${missed.join(', ')}.`
      : 'Close enough to need a second opinion.',
  };
}

/**
 * Map a verdict to the FSRS grade we PRE-SELECT for the user.
 *
 * Suggested, never forced. The user always overrides, because they know whether
 * they actually knew it or guessed, and no grader does.
 *
 * Easy is deliberately never auto-suggested: it more than doubles the interval,
 * and handing that out on the grader's say-so would quietly push cards past the
 * point the user can hold them. Easy stays a thing you choose.
 */
function suggestedRating(verdict) {
  switch (verdict) {
    case Verdict.Correct: return 3;      // Good
    case Verdict.NeedsModel: return 2;   // Hard
    default: return 1;                   // Again
  }
}

return { normalize, Verdict, gradeAnswer, suggestedRating };
})();

// Hand-written seed cards plus cards produced by the generator and passed by the
// validator. They are deliberately indistinguishable at review time - a generated
// card that needed special handling in the UI would be a generated card that was
// not good enough to ship.
const CARDS = [...SEED_CARDS, ...GENERATED_CARDS];

// ---------------------------------------------------------------------------
// This page is a PROVING HARNESS, not the shipping app. Its job is to run the
// real scheduler and the real grader against real cards so the core experience
// can be judged before anything is committed to the Forever Apps React shell.
// The pure modules (fsrs, grading, deck) port over verbatim; this UI gets
// rebuilt in the shell against the same design.
// ---------------------------------------------------------------------------

// ?theme=dark|light forces a theme. Exists so both themes can be captured
// headlessly for review; harmless in the app and the toggle still overrides it.
const qs = new URLSearchParams(location.search);
const forced = qs.get('theme');
if (forced === 'dark' || forced === 'light') document.documentElement.dataset.theme = forced;

// ?demo=graded|retained jumps straight to a screen for visual review. Dev-only:
// the graded and retained screens are otherwise several interactions deep, which
// is exactly why they went unexamined longer than the first screen did.
const demo = qs.get('demo');

const STORE_KEY = 'mc.orgo1.v1';
const RETAINED_DAYS = 30;   // a fact joins the shelf once its interval passes this
const scheduler = new Scheduler();

const load = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) ?? {}; }
                     catch { return {}; } };
const save = (s) => localStorage.setItem(STORE_KEY, JSON.stringify(s));

let states = load();
let view = 'review';        // 'review' | 'retained'
let current = null;         // { card, grade } - grade set once checked
let sessionDone = 0;

const stateFor = (id) => states[id] ?? scheduler.newCard();
const DAY = 86400000;

/** Cards whose due time has passed. New cards (due null) are always due. */
function dueCards(now = Date.now()) {
  return CARDS.filter((c) => {
    const s = stateFor(c.id);
    return s.due == null || s.due <= now;
  });
}

/** Human interval. Minutes below a day, then days, months, years. */
function fmt(ms) {
  const min = ms / 60000;
  if (min < 60) return `${Math.max(1, Math.round(min))} min`;
  const d = ms / DAY;
  if (d < 1) return `${Math.round(min / 60)} h`;
  if (d < 45) return `${Math.round(d)} d`;
  const mo = d / 30.44;
  if (mo < 22) return `${Math.round(mo)} mo`;
  return `${(d / 365.25).toFixed(d / 365.25 < 10 ? 1 : 0)} yr`;
}

/**
 * What each of the four grades would actually buy, in real scheduler output.
 *
 * Possible only because reviewCard is immutable - it returns a new card rather
 * than mutating, so all four futures can be computed without committing any.
 * Showing them is the point: grading feels arbitrary when you cannot see the cost.
 */
function previewIntervals(cardState, now) {
  const out = {};
  for (const r of [Rating.Again, Rating.Hard, Rating.Good, Rating.Easy]) {
    const { card } = scheduler.reviewCard(cardState, r, now);
    out[r] = fmt(card.due - now);
  }
  return out;
}

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'html') n.innerHTML = v;
    else if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== false) n.setAttribute(k, v);
  }
  for (const c of kids) if (c) n.append(c);
  return n;
};

function rail(due, total) {
  const dark = document.documentElement.dataset.theme === 'dark'
    || (!document.documentElement.dataset.theme
        && matchMedia('(prefers-color-scheme: dark)').matches);
  return el('div', { class: 'rail' },
    el('div', { class: 'rail-l' },
      el('span', { class: 'deck' }, DECK.title),
      el('span', { class: 'count' }, total ? `${Math.min(sessionDone + 1, total)} of ${total}` : 'all caught up'),
    ),
    el('div', { class: 'icons' },
      el('button', {
        class: 'ico', 'aria-pressed': String(view === 'retained'),
        onclick: () => { view = view === 'retained' ? 'review' : 'retained'; render(); },
      }, 'Retained'),
      el('button', {
        class: 'ico', title: 'Switch theme',
        onclick: () => {
          document.documentElement.dataset.theme = dark ? 'light' : 'dark';
          render();
        },
      }, dark ? 'Light' : 'Dark'),
    ),
  );
}

function askView(card, total) {
  const ta = el('textarea', {
    placeholder: 'Type what you remember', 'aria-label': 'Your answer', autofocus: 'true',
  });
  const check = () => {
    current = { card, answer: ta.value, grade: gradeAnswer(card, ta.value) };
    render();
  };
  // Ctrl/Cmd+Enter submits, so a two-line answer does not need a mouse.
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); check(); }
  });
  return [
    el('div', { class: 'card' },
      el('p', { class: 'q', html: card.front }),
      ta,
      el('div', { class: 'src' },
        el('b', {}, 'McMurry 10e'), document.createTextNode('·'),
        el('span', { html: card.cite.section }), document.createTextNode('·'),
        el('span', {}, `p. ${card.cite.page}`),
      ),
    ),
    el('button', { class: 'primary', onclick: check }, 'Check my answer'),
  ];
}

function gradedView(card, answer, grade, total) {
  const st = stateFor(card.id);
  const now = Date.now();
  const ivl = previewIntervals(st, now);
  const suggested = suggestedRating(grade.verdict);

  const mark = grade.verdict === Verdict.Correct ? '✓'
             : grade.verdict === Verdict.Incorrect ? '✗' : '~';
  const headline = grade.verdict === Verdict.Correct ? 'You knew it.'
                 : grade.verdict === Verdict.Incorrect ? 'Not this time.'
                 : 'Partly there.';
  // Honest about the unbuilt piece rather than pretending the model answered.
  const tail = grade.verdict === Verdict.NeedsModel
    ? ' This is the band where the app would ask the model to judge it — that call is not wired up yet.'
    : '';

  const apply = (rating) => {
    const { card: next } = scheduler.reviewCard(st, rating, Date.now());
    states[card.id] = next;
    save(states);
    sessionDone += 1;
    current = null;
    render();
  };

  const btn = (rating, cls, label) => el('button', {
    class: `g ${cls}${rating === suggested ? ' suggested' : ''}`,
    onclick: () => apply(rating),
  }, el('b', {}, label), el('span', {}, ivl[rating]));

  return [
    el('div', { class: 'card' },
      answer.trim() ? el('div', { class: 'typed' }, answer.trim()) : null,
      el('div', { class: `verdict v-${grade.verdict}` },
        el('span', { class: 'mark' }, mark),
        el('p', { html: `<strong>${headline}</strong> ${grade.explain}${tail}` }),
      ),
      el('hr', { class: 'hair' }),
      el('p', { class: 'a', html: card.back }),
      el('div', { class: 'src' },
        el('b', {}, 'McMurry 10e'), document.createTextNode('·'),
        el('span', { html: card.cite.section }), document.createTextNode('·'),
        el('span', {}, `p. ${card.cite.page}`),
      ),
    ),
    el('div', { class: 'grade' },
      btn(Rating.Again, 'again', 'Again'),
      btn(Rating.Hard, 'hard', 'Hard'),
      btn(Rating.Good, 'good', 'Good'),
      btn(Rating.Easy, 'easy', 'Easy'),
    ),
  ];
}

function retainedView() {
  const now = Date.now();
  const held = CARDS
    .map((c) => ({ c, s: stateFor(c.id) }))
    .filter(({ s }) => s.due && s.lastReview && (s.due - s.lastReview) >= RETAINED_DAYS * DAY)
    .sort((a, b) => (b.s.due - b.s.lastReview) - (a.s.due - a.s.lastReview));

  return [
    el('div', { class: 'shelf-head' },
      el('h2', {}, 'Retained'),
      el('p', {}, held.length
        ? `${held.length} ${held.length === 1 ? 'fact' : 'facts'} · next check in a month or more`
        : 'Nothing here yet'),
    ),
    el('div', { class: 'card', style: 'padding:6px 20px;min-height:0' },
      held.length
        // `label` is a short noun phrase naming the FACT. The shelf lists things
        // you now know, so an interrogative reads wrong here even when it fits.
        // Falls back to the question with its mark dropped; CSS handles overflow.
        ? el('div', {}, ...held.map(({ c, s }) =>
            el('div', { class: 'row' },
              el('p', { html: c.label ?? c.front.replace(/\?\s*$/, '') }),
              el('span', { class: 'when' }, fmt(s.due - s.lastReview)),
            )))
        : el('p', { class: 'empty' },
            'Answer a card well a few times and it moves here. Nothing is kept from you — this is just the shelf of things you now own.'),
    ),
    el('p', { class: 'foot' }, `A fact moves here once its interval passes ${RETAINED_DAYS} days.`),
  ];
}

function doneView() {
  return [
    el('div', { class: 'card', style: 'justify-content:center;text-align:center' },
      el('h2', {}, 'Done for now'),
      el('p', { class: 'a', style: 'color:var(--soft)' },
        sessionDone
          ? `${sessionDone} ${sessionDone === 1 ? 'card' : 'cards'} reviewed. The rest are scheduled — come back when they are due.`
          : 'Nothing is due. Come back when something is.'),
    ),
    el('button', {
      class: 'primary',
      onclick: () => { states = {}; save(states); sessionDone = 0; current = null; render(); },
    }, 'Reset this deck'),
  ];
}

function render() {
  const app = document.getElementById('app');
  app.replaceChildren();

  const due = dueCards();
  const total = due.length + sessionDone;
  app.append(rail(due, view === 'review' ? total : 0));

  if (view === 'retained') {
    app.append(el('div', { class: 'stage top' }, ...retainedView()));
    return;
  }

  const pct = total ? (sessionDone / total) * 100 : 100;
  app.append(el('div', { class: 'progress' }, el('i', { style: `width:${pct}%` })));

  const body = current ? gradedView(current.card, current.answer, current.grade, total)
             : due.length ? askView(due[0], total)
             : doneView();
  app.append(el('div', { class: 'stage' }, ...body));

  const ta = app.querySelector('textarea');
  if (ta) ta.focus();
}

if (demo === 'graded') {
  const card = CARDS[0];
  const answer = 'backside attack, flips the stereochem';
  current = { card, answer, grade: gradeAnswer(card, answer) };
} else if (demo === 'retained') {
  view = 'retained';
  const now = Date.now();
  [[0, 486], [1, 340], [2, 212], [3, 151], [4, 96], [5, 63]].forEach(([i, days]) => {
    if (!CARDS[i]) return;
    states[CARDS[i].id] = {
      ...scheduler.newCard(), state: State.Review, step: null,
      stability: days, difficulty: 5,
      lastReview: now - DAY, due: now - DAY + days * DAY,
    };
  });
}

render();

</script>
